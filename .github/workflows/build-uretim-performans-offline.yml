name: Build Uretim Performans Offline APK

on:
  push:
    branches:
      - uretim-performans-offline-v0.9.1
    paths:
      - 'offline-apk/**'
      - '.github/workflows/build-uretim-performans-offline.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offline-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Rebuild embedded offline UI
        run: |
          mkdir -p app/src/main/assets
          cat builder/index.part*.b64 | base64 -d | gzip -d > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q 'v0.9.0' app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Uretim-Performans-v0.9.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uretim-Performans-v0.9.1
          path: offline-apk/Uretim-Performans-v0.9.1.apk
          if-no-files-found: error
          retention-days: 14
