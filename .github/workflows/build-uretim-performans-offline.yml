name: Build Uretim Performans Offline APK

on:
  push:
    branches:
      - uretim-performans-offline-v1.1.0
    paths:
      - 'offline-apk/**'
      - '.github/workflows/build-uretim-performans-offline.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offline-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Rebuild embedded offline UI
        run: |
          mkdir -p app/src/main/assets
          cat builder/index.part*.b64 | base64 -d | gzip -d > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q 'v0.9.0' app/src/main/assets/index.html

      - name: Apply v0.9.3 stability and UI fixes
        run: |
          python builder/patch_v093.py
          grep -q 'printReportBtn' app/src/main/assets/index.html
          grep -q 'qualityFilterBar' app/src/main/assets/index.html

      - name: Make v1 report patch binding robust
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('builder/patch_v100.py')
          s=p.read_text(encoding='utf-8')
          marker='old="""  qsa(\'#periodTabs button\')'
          start=s.find(marker)
          if start < 0:
              raise SystemExit('v1 bind patch source block not found')
          tail='html=html.replace(old,new,1)'
          end=s.find(tail,start)
          if end < 0:
              raise SystemExit('v1 bind patch tail not found')
          end += len(tail)
          replacement="""anchor=\"qsa('#performanceTabs button').forEach(b=>b.onclick=()=>{ currentPerformanceDimension=b.dataset.dimension; runReport(); });\"\nif anchor not in html: raise SystemExit('performance bind anchor missing')\nhtml=html.replace(anchor,anchor+\" qsa('#reportDetailTabs button').forEach(b=>b.onclick=()=>{currentReportDetail=b.dataset.reportDetail;renderExtendedReport(currentReportDetail,currentReportRows);});\",1)"""
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply v1.0 report center
        run: |
          python builder/patch_v100.py
          grep -q 'reportDetailTabs' app/src/main/assets/index.html
          grep -q 'renderExtendedReport' app/src/main/assets/index.html
          grep -q 'Vardiya Karşılaştırması' app/src/main/assets/index.html
          grep -q 'İş Emri Analizi' app/src/main/assets/index.html

      - name: Apply full v1 manager PDF
        run: |
          python builder/patch_v100_pdf.py
          grep -q 'printReportFullV100' app/src/main/assets/index.html
          grep -q 'Fire Pareto' app/src/main/assets/index.html
          grep -q 'Detaylı Üretim Kayıtları' app/src/main/assets/index.html

      - name: Apply v1.1 dashboard color and quality update
        run: |
          cat builder/patch_v110.part* > /tmp/patch_v110.py
          python /tmp/patch_v110.py
          grep -q 'v1.1.0-stable-install' app/src/main/assets/index.html
          grep -q 'dashboardPeriodTabs' app/src/main/assets/index.html
          grep -q 'shiftGrid' app/src/main/assets/index.html
          grep -q 'Kalıp Sayısından Renk Analizi' app/src/main/assets/index.html
          grep -q 'drillWorkOrderStats' app/src/main/assets/index.html

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/upm-v11.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/upm-v11.js

      - name: Set Android UI version
        run: |
          sed -i 's/v0.9.2/v1.1.0/g; s/v0.9.3/v1.1.0/g; s/v1.0.0/v1.1.0/g; s/return "0.9.2"/return "1.1.0"/g; s/return "0.9.3"/return "1.1.0"/g; s/return "1.0.0"/return "1.1.0"/g' app/src/main/java/com/tufanprintops/uretimperformans/MainActivity.java

      - name: Build clean APK
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Verify APK and stable package id
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt | head -n 12
          grep -q "package: name='com.tufanprintops.uretimperformans.stable'" /tmp/badging.txt
          grep -q "versionCode='1100'" /tmp/badging.txt

      - name: Prepare intermediate APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Uretim-Performans-Merkezi-v1.1.0-intermediate.apk

      - name: Upload intermediate APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uretim-Performans-Merkezi-v1.1.0-intermediate
          path: offline-apk/Uretim-Performans-Merkezi-v1.1.0-intermediate.apk
          if-no-files-found: error
          retention-days: 14
