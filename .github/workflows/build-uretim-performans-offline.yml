name: Build Uretim Performans Offline APK

on:
  push:
    branches:
      - uretim-performans-offline-v0.9.3
    paths:
      - 'offline-apk/**'
      - '.github/workflows/build-uretim-performans-offline.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offline-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Rebuild embedded offline UI
        run: |
          mkdir -p app/src/main/assets
          cat builder/index.part*.b64 | base64 -d | gzip -d > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q 'v0.9.0' app/src/main/assets/index.html

      - name: Apply v0.9.3 UI fixes
        run: |
          python builder/patch_v093.py
          grep -q 'v0.9.3-source-build' app/src/main/assets/index.html
          grep -q 'printReportBtn' app/src/main/assets/index.html
          grep -q 'qualityFilterBar' app/src/main/assets/index.html

      - name: Set v0.9.3 Android version
        run: |
          sed -i "s/versionCode 902/versionCode 903/" app/build.gradle
          sed -i "s/versionName '0.9.2'/versionName '0.9.3'/" app/build.gradle
          sed -i 's/v0.9.2/v0.9.3/g; s/return "0.9.2"/return "0.9.3"/g' app/src/main/java/com/tufanprintops/uretimperformans/MainActivity.java

      - name: Build clean debug APK
        run: |
          gradle clean :app:assembleDebug --stacktrace

      - name: Verify APK signature and package
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 8

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Uretim-Performans-Merkezi-v0.9.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uretim-Performans-Merkezi-v0.9.3-clean
          path: offline-apk/Uretim-Performans-Merkezi-v0.9.3.apk
          if-no-files-found: error
          retention-days: 14
