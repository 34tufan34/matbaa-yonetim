name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_note:
        description: 'Test/release note'
        required: false
        default: 'Manual APK build'

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure Android platform files
        run: flutter create . --platforms=android --project-name=matbaa_mobile
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: matbaa-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
