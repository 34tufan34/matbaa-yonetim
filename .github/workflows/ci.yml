name: CI

on:
  push:
    branches: [main, develop, 'agent/**']
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://matbaa:matbaa@localhost:5432/matbaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  mobile:
    name: Flutter checks and web preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure web and Android platform files
        run: flutter create . --platforms=web,android --project-name=matbaa_mobile
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Upload web test bundle
        uses: actions/upload-artifact@v4
        with:
          name: matbaa-web-preview
          path: apps/mobile/build/web
          if-no-files-found: error

  patrol-apk:
    name: Patrol Ambalaj APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed APK
        working-directory: apps/patrol-baski-apk
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and rename APK
        shell: bash
        run: |
          APK="apps/patrol-baski-apk/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          cp "$APK" "Patrol-Ambalaj-Baski-Takip-v1.0.0.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Patrol-Ambalaj-Baski-Takip-v1.0.0
          path: Patrol-Ambalaj-Baski-Takip-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
