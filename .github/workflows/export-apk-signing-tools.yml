name: Export APK Signing Tools

on:
  push:
    branches:
      - apk-signing-tools
    paths:
      - '.github/workflows/export-apk-signing-tools.yml'
  workflow_dispatch:

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'build-tools;35.0.0'

      - name: Collect signing tools
        run: |
          mkdir -p apk-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" apk-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" apk-tools/
          cp -R "$ANDROID_HOME/build-tools/35.0.0/lib" apk-tools/
          chmod +x apk-tools/apksigner apk-tools/zipalign

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tools-35
          path: apk-tools
          retention-days: 2
