plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tufanprintops.uretimperformans'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tufanprintops.uretimperformans'
        minSdk 26
        targetSdk 35
        versionCode 900
        versionName '0.9.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
