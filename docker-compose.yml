services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: matbaa
      POSTGRES_USER: matbaa
      POSTGRES_PASSWORD: matbaa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - matbaa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matbaa -d matbaa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matbaa_pg:
